<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BioAdaptive</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=24">
</head>
<body class="auth-page">
    <div class="video-background-container">
        <video id="bgVideo" class="bg-video" autoplay loop muted playsinline>
            <source src="12802144_3840_2160_30fps.mp4" type="video/mp4">
        </video>
    </div>
    <div class="grain-overlay"></div>

    <div class="auth-container">
        <div class="auth-card card">
            <div class="auth-header">
                <div class="logo">
                    <img src="logo.png" alt="BioAdaptive Logo" class="logo-img">
                    <span>BioAdaptive</span>
                </div>
                <h1>Welcome Back</h1>
                <p>Sign in to continue your adaptive experience</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <div class="auth-actions">
                    <label class="remember-me">
                        <input type="checkbox"> <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>
                <button type="submit" class="primary-btn auth-submit">
                    Sign In
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>

            <div class="auth-divider">
                <span>or continue with</span>
            </div>

            <div class="social-auth single-provider">
                <button type="button" class="social-btn google-btn" id="googleAuthBtn">
                    <img src="https://www.gstatic.com/images/branding/product/1x/googleg_48dp.png" alt="Google" width="20">
                    Continue with Google
                </button>
            </div>

            <p class="auth-footer">
                Don't have an account? <a href="signup.html">Create one for free</a>
            </p>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
